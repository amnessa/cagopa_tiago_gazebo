controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    # No specific parameters needed for joint_state_broadcaster

panda_arm_controller:
  ros__parameters:
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    allow_partial_joints_goal: false
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.6
      panda_joint1:
        trajectory: 0.05
        goal: 0.03
      panda_joint2:
        trajectory: 0.05
        goal: 0.03
      panda_joint3:
        trajectory: 0.05
        goal: 0.03
      panda_joint4:
        trajectory: 0.05
        goal: 0.03
      panda_joint5:
        trajectory: 0.05
        goal: 0.03
      panda_joint6:
        trajectory: 0.05
        goal: 0.03
      panda_joint7:
        trajectory: 0.05
        goal: 0.03
